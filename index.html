document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

;\n    font-weight: 300;\n  }\n\n  .toast {\n    position: fixed;\n    bottom: 28px; left: 50%;\n    transform: translateX(-50%) translateY(20px);\n    background: var(--navy);\n    color: #fff;\n    font-family: var(--font);\n    font-size: 14px;\n    font-weight: 400;\n    padding: 13px 22px;\n    border-radius: 0 0 20px 0;\n    opacity: 0;\n    pointer-events: none;\n    transition: opacity 200ms, transform 200ms;\n    z-index: 50;\n  }\n  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }\n\n  /* ---------- Personalise form ---------- */\n  .editor { padding: 0 48px 40px; }\n  .editor-card {\n    max-width: 720px;\n    margin: 0 auto;\n    background: #FFFFFF;\n    border: 1px solid var(--line);\n    border-radius: 0 0 28px 0;\n    padding: 30px 34px 32px;\n    box-shadow: 0 0 9px 4px rgba(112,112,112,0.06);\n  }\n  .editor-card h3 {\n    font-family: var(--font);\n    font-weight: 500;\n    font-size: 18px;\n    margin: 0 0 5px;\n    color: var(--navy);\n  }\n  .editor-sub {\n    font-size: 14px;\n    line-height: 1.5;\n    color: var(--grey);\n    margin: 0 0 24px;\n  }\n  .field-grid {\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 16px 22px;\n  }\n  .field { display: flex; flex-direction: column; gap: 7px; }\n  .field.full { grid-column: 1 / -1; }\n  .field label {\n    font-family: var(--mono);\n    font-size: 12px;\n    letter-spacing: -0.01em;\n    color: var(--deep);\n    text-transform: lowercase;\n  }\n  .field input {\n    font-family: var(--font);\n    font-size: 14px;\n    font-weight: 300;\n    color: var(--ink);\n    background: var(--off-white);\n    border: 1px solid var(--line);\n    border-radius: 2px;\n    padding: 11px 13px;\n    outline: none;\n    transition: border-color 140ms cubic-bezier(0.2,0.6,0.2,1), background 140ms;\n  }\n  .field input:focus { border-color: var(--deep); background: #fff; }\n  .editor-actions {\n    display: flex;\n    align-items: center;\n    gap: 18px;\n    margin-top: 26p rosoft.com/l/chat/0/0?users=Henry.O'Lone@wasp.co.uk\" style=\"color:#364153;text-decoration:underline;\">Teams<\u002Fa><\u002Ftd>\n                  <td style=\"vertical-align:middle;width:20px;padding:0 11px 0 0;\"><img src=\"f7e12b54-1f9d-47a1-8cae-e5eb3fb5541a\" data-img=\"linkedin.png\" alt=\"\" width=\"20\" height=\"20\" style=\"display:block;width:20px;height:20px;\"><\u002Ftd>\n                  <td style=\"vertical-align:middle;padding:0;font-size:14px;line-height:1.2;\"><a id=\"sig-linkedin\" href=\"https://www.linkedin.com/company/wasp-ipu\" style=\"color:#364153;text-decoration:underline;\">LinkedIn<\u002Fa><\u002Ftd>\n                <\u002Ftr>\n              <\u002Ftbody><\u002Ftable>\n              <div style=\"border-top:1px solid #E5E7EB;margin-top:18px;font-size:0;line-height:0;height:0;\">&nbsp;<\u002Fdiv>\n              <table style=\"border-collapse:collapse;margin-top:16px;\">\n                <tbody><tr>\n                  <td style=\"vertical-align:top;width:20px;padding:1px 14px 0 0;\"><img src=\"aa5eb94b-7d15-4498-96e4-608d2d378a60\" data-img=\"location.png\" alt=\"\" width=\"20\" height=\"20\" style=\"display:block;width:20px;height:20px;\"><\u002Ftd>\n                  <td id=\"sig-office\" style=\"vertical-align:top;font-size:14px;color:#4A5565;line-height:1.45;\">25 North Orbital Commercial Park, St. Albans, Hertfordshire, AL1 1XB<\u002Ftd>\n                <\u002Ftr>\n              <\u002Ftbody><\u002Ftable>\n            <\u002Ftd>\n            <td width=\"236\" valign=\"top\" bgcolor=\"#FFFFFF\" style=\"width:236px;background:#FFFFFF;padding:0;font-size:0;line-height:0;\">\n              <img src=\"e5ebfba0-b158-4136-a904-faee5b681f39\" data-img=\"panel.png\" alt=\"WASP IPU\" width=\"236\" height=\"300\" style=\"display:block;width:236px;height:300px;border:0;\">\n            <\u002Ftd>\n          <\u002Ftr>\n          <tr>\n            <td colspan=\"2\" bgcolor=\"#F9FAFB\" style=\"background:#F9FAFB;border-top:1px solid #E5E7EB;padding:13px 38px;\">\n              <div style=\"font-size:11px;line-height:1.65;color:#6A7282;font-family:Arial,Helvetica,sans-serif;letter-spacing:0.1px;\">\n                WASP Industrial Power Units Limited, registered in England &amp; Wales no.&nbsp;12167631. Registered office: Aston House, Cornwall Avenue, London, N3&nbsp;1LF. This email is confidential and intended only for the named recipient. If received in error, please delete it.\n              <\u002Fdiv>\n            <\u002Ftd>\n          <\u002Ftr>\n        <\u002Ftbody><\u002Ftable>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ Personalise form ============ -->\n  <section class=\"editor\">\n    <div class=\"editor-card\">\n      <h3>Personalise your signature<\u002Fh3>\n      <p class=\"editor-sub\">Edit the fields below — the signature above updates live. Then copy it straight into Outlook or Gmail.<\u002Fp>\n      <div class=\"field-grid\">\n        <div class=\"field\"><label>full name<\u002Flabel><input id=\"in_name\" type=\"text\" value=\"Henry O’Lone\" autocomplete=\"off\"><\u002Fdiv>\n        <div class=\"field\"><label>job title<\u002Flabel><input id=\"in_role\" type=\"text\" value=\"Managing Director\" autocomplete=\"off\"><\u002Fdiv>\n        <div class=\"field\"><label>phone<\u002Flabel><input id=\"in_phone\" type=\"text\" value=\"+44 (0)1700 507 070\" autocomplete=\"off\"><\u002Fdiv>\n        <div class=\"field\"><label>email<\u002Flabel><input id=\"in_email\" type=\"email\" value=\"Henry.O'Lone@wasp.co.uk\" autocomplete=\"off\"><\u002Fdiv>\n        <div class=\"field full\"><label>linkedin url<\u002Flabel><input id=\"in_linkedin\" type=\"url\" value=\"https://www.linkedin.com/company/wasp-ipu\" autocomplete=\"off\"><\u002Fdiv>\n        <div class=\"field full\"><label>teams url<\u002Flabel><input id=\"in_teams\" type=\"url\" value=\"https://teams.microsoft.com/l/chat/0/0?users=Henry.O'Lone@wasp.co.uk\" autocomplete=\"off\"><\u002Fdiv>\n        <div class=\"field full office\">\n          <label>office address<\u002Flabel>\n          <div class=\"opts\">\n            <label class=\"radio\"><input type=\"radio\" name=\"office\" value=\"southeast\" checked=\"\"> South East Office<\u002Flabel>\n            <label class=\"radio\"><input type=\"radio\" name=\"office\" value=\"westmidlands\"> West Midlands Office<\u002Flabel>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"editor-actions\">\n        <button class=\"copy-btn\" data-target=\"sig1\"><span class=\"chev\"><\u002Fspan>Copy signature<\u002Fbutton>\n        <span class=\"hint\" id=\"char-count\">&nbsp;<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ How-to (team) ============ -->\n  <div class=\"note\">\n    <h3>How to set up your signature<\u002Fh3>\n    <ol>\n      <li><strong>Fill in your details<\u002Fstrong> in the form above — the preview updates as you type.<\u002Fli>\n      <li><strong>Click “Copy signature.”<\u002Fstrong><\u002Fli>\n      <li><strong>Paste it into your email signature settings:<\u002Fstrong>\n        <div class=\"how-clients\">\n          <div><span class=\"client\">Outlook<\u002Fspan> File → Options → Mail → Signatures → New → paste → Save.<\u002Fdiv>\n          <div><span class=\"client\">New&nbsp;Outlook / Web<\u002Fspan> Settings → Accounts → Signatures → paste → Save.<\u002Fdiv>\n          <div><span class=\"client\">Gmail<\u002Fspan> Settings (gear) → See all settings → Signature → Create new → paste → Save changes.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fli>\n    <\u002Fol>\n    <p class=\"note-foot\">That’s it — the logo and icons travel with the signature, so there’s nothing to install.<\u002Fp>\n  <\u002Fdiv>\n\n<\u002Fmain>\n\n<div class=\"toast\" id=\"toast\">Signature copied — ready to paste<\u002Fdiv>\n\n<script>\n  // ---- Image handling for the COPIED signature ----\n  // \"\" = embed the images directly in the signature (self-contained, no hosting).\n  // Or set a hosted folder URL (no trailing slash) to point copies there instead.\n  const LOGO_BASE = \"https://cdn.jsdelivr.net/gh/wissemchiheb-glitch/wasp-signature@main\";\n\n  const toast = document.getElementById('toast');\n  let toastTimer = null;\n  function showToast(msg) {\n    toast.textContent = msg;\n    toast.classList.add('show');\n    clearTimeout(toastTimer);\n    toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);\n  }\n\n  function buildHtml(targetId) {\n    const node = document.getElementById(targetId).cloneNode(true);\n    // Point the copied signature's hosted images at the CDN; leave the embedded photo as-is.\n    node.querySelectorAll('img').forEach(img => {\n      const rel = img.getAttribute('data-img');\n      if (LOGO_BASE && rel) img.setAttribute('src', LOGO_BASE.replace(/\\/$/, '') + '/' + rel);\n      const copy = img.getAttribute('data-copy');   // photo: use the Gmail-safe / hosted version when copying\n      if (copy) img.setAttribute('src', copy);\n      img.removeAttribute('data-img');\n      img.removeAttribute('data-copy');\n    });\n    // Strip inter-tag whitespace so the signature stays well under Gmail's 10k limit.\n    return node.innerHTML.replace(/>\\s+<\u002Fg, '><').trim();\n  }\n\n  async function copySig(targetId) {\n    const html = buildHtml(targetId);\n    const tmp = document.createElement('div');\n    tmp.innerHTML = html;\n    const text = tmp.innerText.replace(/\\n{3,}/g, '\\n\\n').trim();\n    try {\n      await navigator.clipboard.write([\n        new ClipboardItem({\n          'text/html': new Blob([html], { type: 'text/html' }),\n          'text/plain': new Blob([text], { type: 'text/plain' })\n        })\n      ]);\n      showToast('Signature copied — ready to paste');\n      return true;\n    } catch (e) {\n      // Fallback: build the rewritten HTML into a temp node, select & copy it\n      try {\n        const holder = document.createElement('div');\n        holder.setAttribute('contenteditable', 'true');\n        holder.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';\n        holder.innerHTML = html;\n        document.body.appendChild(holder);\n        const range = document.createRange();\n        range.selectNodeContents(holder);\n        const sel = window.getSelection();\n        sel.removeAllRanges();\n        sel.addRange(range);\n        document.execCommand('copy');\n        sel.removeAllRanges();\n        document.body.removeChild(holder);\n        showToast('Signature copied — ready to paste');\n        return true;\n      } catch (e2) {\n        showToast('Copy failed — select the signature manually');\n        return false;\n      }\n    }\n  }\n\n  document.querySelectorAll('.copy-btn').forEach(btn => {\n    btn.addEventListener('click', async () => {\n      const ok = await copySig(btn.dataset.target);\n      if (ok) {\n        const label = btn.childNodes;\n        btn.classList.add('copied');\n        const original = btn.innerHTML;\n        btn.innerHTML = '<span class=\"chev\"><\u002Fspan>Copied';\n        setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = original; }, 1800);\n      }\n    });\n  });\n\n  // ---- Live personalisation ----\n  function bind(inputId, fn) {\n    const el = document.getElementById(inputId);\n    if (!el) return;\n    el.addEventListener('input', () => fn(el.value.trim()));\n  }\n  bind('in_name', v => { document.getElementById('sig-name').textContent = v; });\n  bind('in_role', v => { document.getElementById('sig-role').textContent = v; });\n  bind('in_phone', v => { document.getElementById('sig-phone').textContent = v; });\n  bind('in_email', v => {\n    const a = document.getElementById('sig-email');\n    a.textContent = v;\n    a.setAttribute('href', 'mailto:' + v);\n  });\n  bind('in_linkedin', v => { document.getElementById('sig-linkedin').setAttribute('href', v); });\n  bind('in_teams', v => { document.getElementById('sig-teams').setAttribute('href', v); });\n\n  // ---- Live size counter (Gmail rejects signatures over ~10,000 characters) ----\n  function updateCount() {\n    const el = document.getElementById('char-count');\n    if (!el) return;\n    const n = buildHtml('sig1').length;\n    const ok = n <= 10000;\n    el.textContent = (ok ? '\\u2713 ' : '\\u26A0 ') + n.toLocaleString() + ' / 10,000 characters' + (ok ? ' \\u2014 fits Gmail' : ' \\u2014 too long for Gmail');\n    el.style.color = ok ? '#1F8A5B' : '#B00020';\n  }\n  ['in_name','in_role','in_phone','in_email','in_linkedin','in_teams'].forEach(id => {\n    const el = document.getElementById(id);\n    if (el) el.addEventListener('input', updateCount);\n  });\n\n  // ---- Office address selector ----\n  const OFFICES = {\n    southeast: '25 North Orbital Commercial Park, St. Albans, Hertfordshire, AL1 1XB',\n    westmidlands: '12 Union Park, Navigation Way, West Bromwich, West Midlands, B70 9DF'\n  };\n  document.querySelectorAll('input[name=\"office\"]').forEach(r => {\n    r.addEventListener('change', () => {\n      if (r.checked) { document.getElementById('sig-office').innerHTML = OFFICES[r.value]; updateCount(); }\n    });\n  });\n\n  // ---- Photo: crop to a square JPEG, auto-compressed to always fit Gmail's 10k\n  //      limit. Tries the sharpest size first, steps down only if needed. Rings\n  //      are styled in HTML, so this just outputs a square. ----\n  function compositePhoto(srcImg, done) {\n    const TARGET = 2900;                 // char budget for the embedded photo\n    const sizes = [148, 132, 120, 108, 96, 84, 72];\n    const qualities = [0.62, 0.52, 0.44, 0.38, 0.32, 0.28, 0.24, 0.2];\n    const iw = srcImg.naturalWidth || srcImg.width, ih = srcImg.naturalHeight || srcImg.height;\n    let last = '';\n    for (let si = 0; si < sizes.length; si++) {\n      const S = sizes[si];\n      const c = document.createElement('canvas'); c.width = S; c.height = S;\n      const x = c.getContext('2d');\n      const sc = Math.max(S/iw, S/ih), dw = iw*sc, dh = ih*sc;\n      x.drawImage(srcImg, (S-dw)/2, (S-dh)/2, dw, dh);\n      for (let qi = 0; qi < qualities.length; qi++) {\n        last = c.toDataURL('image/jpeg', qualities[qi]);\n        if (last.length <= TARGET) { done(last); return; }\n      }\n    }\n    done(last); // smallest/most-compressed fallback\n  }\n  function setPhoto(src) {\n    // Display the photo at FULL quality; prepare a compressed copy for Gmail separately.\n    const sp = document.getElementById('sig-photo');\n    const pv = document.getElementById('photo-preview');\n    if (sp) sp.setAttribute('src', src);\n    if (pv) pv.setAttribute('src', src);\n    const im = new Image();\n    im.onload = () => {\n      try {\n        compositePhoto(im, d => { if (sp) sp.setAttribute('data-copy', d); updateCount(); });\n      } catch (e) { if (sp) sp.setAttribute('data-copy', src); updateCount(); }\n    };\n    im.onerror = () => updateCount();\n    im.src = src;\n  }\n  (function () {\n    const sp = document.getElementById('sig-photo');\n    if (sp) setPhoto(sp.getAttribute('src'));\n  })();\n  // upload handler — accepts any reasonable image; it's auto-optimised to a small square\n  const MAX_UPLOAD_MB = 8;\n  const photoInput = document.getElementById('in_photo');\n  if (photoInput) {\n    photoInput.addEventListener('change', e => {\n      const file = e.target.files && e.target.files[0];\n      if (!file) return;\n      if (!/^image\\//.test(file.type)) { showToast('Please choose an image file (JPG or PNG)'); e.target.value = ''; return; }\n      if (file.size > MAX_UPLOAD_MB * 1024 * 1024) {\n        showToast('That photo is over ' + MAX_UPLOAD_MB + ' MB — please choose a smaller image');\n        e.target.value = '';\n        return;\n      }\n      const reader = new FileReader();\n      reader.onload = ev => setPhoto(ev.target.result);\n      reader.readAsDataURL(file);\n    });\n  }\n\n  // photo URL handler — uses a hosted image directly (full quality, ~no character cost)\n  const photoUrl = document.getElementById('in_photo_url');\n  if (photoUrl) {\n    photoUrl.addEventListener('input', () => {\n      const v = photoUrl.value.trim();\n      if (!v) return;\n      const sp = document.getElementById('sig-photo'); if (sp) { sp.setAttribute('src', v); sp.setAttribute('data-copy', v); }\n      const pv = document.getElementById('photo-preview'); if (pv) pv.setAttribute('src', v);\n      updateCount();\n    });\n  }\n\n  // ---- (Icons + logo + panel stay on GitHub; the live preview uses the bundled\n  //      local copies so it always renders, and buildHtml() swaps in the hosted\n  //      URLs for both the Copy button and the fallback above.) ----\n  updateCount();\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
